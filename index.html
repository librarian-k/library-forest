<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Library Forest</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div id="game">

    <!-- 배경 -->
    <img
        id="background"
        src="assets/background.png"
        alt="공주도서관">

    <!-- 하늘 -->
    <div id="sky">

        <img
            class="cloud cloud1"
            src="assets/cloud1.png"
            alt="">

    </div>

    <!-- 새 -->
    <div id="bird"></div>

    <!-- 다람쥐 -->
    <div id="squirrel"></div>

    <!-- 낙엽 -->
    <div id="leaves"></div>

    <!-- 화면 터치 -->

    <div id="touchButton">

        화면을 터치하세요

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
